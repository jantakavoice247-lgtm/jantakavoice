<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>People's Press · Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: #0b1a2e;
        }

        .register-container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12);
            padding: 2.5rem 2.5rem 3rem;
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-header .logo {
            width: 56px;
            height: 56px;
            background: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.4rem;
            margin: 0 auto 0.8rem;
        }

        .register-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b1a2e;
        }

        .register-header p {
            color: #6b7280;
            font-size: 0.95rem;
            margin-top: 0.2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f2a44;
            margin-bottom: 0.3rem;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa8b9;
            font-size: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            border: 1.5px solid #e2e7ed;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.15s, box-shadow 0.15s;
            background: #fafbfc;
            color: #0b1a2e;
        }

        .form-group input::placeholder {
            color: #9aa8b9;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
            background: #ffffff;
        }

        .form-group .error-msg {
            font-size: 0.8rem;
            color: #dc2626;
            display: none;
            margin-top: 0.3rem;
        }

        .form-group.error input {
            border-color: #dc2626;
            background: #fef2f2;
        }

        .form-group.error .error-msg {
            display: block;
        }

        .btn-register {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: 'Inter', sans-serif;
            color: white;
            background: #2563eb;
        }

        .btn-register:hover {
            background: #1d4ed8;
            transform: scale(1.01);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-register .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        .btn-register.loading .btn-text {
            display: none;
        }

        .btn-register.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .form-footer {
            margin-top: 1.2rem;
            text-align: center;
            font-size: 0.9rem;
            color: #4a5a72;
        }

        .form-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1f2937;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            font-weight: 500;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 0.7rem;
            z-index: 999;
            animation: slideUp 0.3s ease;
            max-width: 400px;
        }

        .toast.show {
            display: flex;
        }

        .toast i {
            font-size: 1.2rem;
        }

        .toast.success i {
            color: #34d399;
        }
        .toast.error i {
            color: #f87171;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            transition: color 0.15s;
        }

        .back-link:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 1.5rem;
            }
            .register-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="register-container">
        <a href="login.html" class="back-link">← Back to Login</a>

        <div class="register-header">
            <div class="logo">PP</div>
            <h1>Create Account</h1>
            <p>Join People's Press as an anonymous contributor</p>
        </div>

        <form id="registerForm" novalidate>
            <div class="form-group" id="nameGroup">
                <label for="regName">Full Name</label>
                <div class="input-wrapper">
                    <i data-lucide="user"></i>
                    <input type="text" id="regName" placeholder="Enter your full name" required />
                </div>
                <div class="error-msg" id="nameError">Please enter your name</div>
            </div>

            <div class="form-group" id="emailGroup">
                <label for="regEmail">Email Address</label>
                <div class="input-wrapper">
                    <i data-lucide="mail"></i>
                    <input type="email" id="regEmail" placeholder="Enter your email" required />
                </div>
                <div class="error-msg" id="emailError">Please enter a valid email</div>
            </div>

            <div class="form-group" id="phoneGroup">
                <label for="regPhone">Phone Number (optional)</label>
                <div class="input-wrapper">
                    <i data-lucide="phone"></i>
                    <input type="tel" id="regPhone" placeholder="Enter your phone number" />
                </div>
            </div>

            <div class="form-group" id="passwordGroup">
                <label for="regPassword">Password</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input type="password" id="regPassword" placeholder="Create a password (min 6 characters)" required />
                </div>
                <div class="error-msg" id="passwordError">Password must be at least 6 characters</div>
            </div>

            <button type="submit" class="btn-register" id="submitBtn">
                <span class="btn-text">Create Account</span>
                <span class="spinner"></span>
            </button>

            <div class="form-footer">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </form>
    </div>

    <div class="toast" id="toast">
        <i data-lucide="check-circle"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <script src="api.js"></script>
    <script>
        (function() {
            'use strict';

            const form = document.getElementById('registerForm');
            const nameInput = document.getElementById('regName');
            const emailInput = document.getElementById('regEmail');
            const phoneInput = document.getElementById('regPhone');
            const passwordInput = document.getElementById('regPassword');
            const submitBtn = document.getElementById('submitBtn');

            // Toast
            let toastTimeout;

            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toastMessage');
                toastMsg.textContent = message;
                toast.className = 'toast ' + type + ' show';
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 4000);
                lucide.createIcons();
            }

            function validateField(groupId, value, condition) {
                const group = document.getElementById(groupId);
                const isValid = condition ? condition(value) : (value && value.trim() !== '');
                if (!isValid) {
                    group.classList.add('error');
                    return false;
                } else {
                    group.classList.remove('error');
                    return true;
                }
            }

            function setLoading(isLoading) {
                if (isLoading) {
                    submitBtn.classList.add('loading');
                    submitBtn.disabled = true;
                } else {
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const nameOk = validateField('nameGroup', nameInput.value);
                const emailOk = validateField('emailGroup', emailInput.value, 
                    (v) => v && v.trim() !== '' && v.includes('@'));
                const passwordOk = validateField('passwordGroup', passwordInput.value,
                    (v) => v && v.length >= 6);

                if (!nameOk || !emailOk || !passwordOk) {
                    showToast('❌ Please fix the errors above.', 'error');
                    return;
                }

                setLoading(true);

                try {
                    const response = await window.PeoplesPressAPI.auth.register({
                        name: nameInput.value.trim(),
                        email: emailInput.value.trim(),
                        phone: phoneInput.value.trim() || '',
                        password: passwordInput.value,
                    });

                    setLoading(false);

                    if (response.success) {
                        showToast('✅ Registration successful! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = 'home.html';
                        }, 1200);
                    } else {
                        showToast('❌ ' + (response.message || 'Registration failed.'), 'error');
                    }
                } catch (error) {
                    setLoading(false);
                    showToast('❌ ' + (error.message || 'Registration failed. Please try again.'), 'error');
                }
            });

            // Real-time validation clearing
            nameInput.addEventListener('input', () => document.getElementById('nameGroup').classList.remove('error'));
            emailInput.addEventListener('input', () => document.getElementById('emailGroup').classList.remove('error'));
            passwordInput.addEventListener('input', () => document.getElementById('passwordGroup').classList.remove('error'));

            lucide.createIcons();
            console.log('📝 Register page ready with backend API');

        })();
    </script>

</body>
</html>
